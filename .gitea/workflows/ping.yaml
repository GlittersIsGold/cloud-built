name: Building cloud-images
on: 
  workflow_dispatch:

jobs:
  ping-test:
    runs-on: alt-sisyphus
    steps:
      - name: Configure ssh
        run: |
          apt-get update && apt-get install -y traceroute bind-utils iputils net-tools
          ping -c 3 ${{ secrets.BUILDER_SSH_HOST }} ||:
          route
          nslookup ${{ secrets.BUILDER_SSH_HOST }} ||:
          traceroute ${{ secrets.BUILDER_SSH_HOST }} ||:
          ip route
          cat /etc/hosts
          echo "add route:"
          ip route add 10.0.0.0/8 via 10.4.190.1 dev eth0 ||:
          ip route
          ping -c 3 ${{ secrets.BUILDER_SSH_HOST }} ||:
          nslookup ${{ secrets.BUILDER_SSH_HOST }} ||:
