---
remote: 'cloud@master:/home/cloud/images/{branch}/{arch}'
repository_url: http://mirror.yandex.ru/altlinux/{branch}/branch
try_build_all: True
log_level: debug

rebuild_after:
  days: 5

images:
  rootfs-minimal:
    target: ve/docker
    kinds:
    - tar.xz
    tests:
    - method: docker
  rootfs-systemd:
    target: ve/systemd-networkd
    kinds:
    - tar.xz
    tests:
    - method: lxd
    scripts:
    - securetty
  rootfs-systemd-etcnet:
    target: ve/systemd-etcnet
    kinds:
    - tar.xz
    tests:
    - method: lxd
    scripts:
    - securetty
  rootfs-sysvinit:
    target: ve/sysvinit-etcnet
    kinds:
    - tar.xz
    tests:
    - method: lxd
    scripts:
    - securetty
  cloud:
    target: vm/cloud-systemd
    kinds:
    - qcow2c
    rename:
      regex: '(.*)\.qcow2c$'
      to: '\1.qcow2'
  workstation-cloud:
    target: vm/alt-workstation-cloud
    kinds:
    - qcow2c
    exclude_branches:
    - Sisyphus
    - p9
    - p8
    - c8
    rename:
      regex: '(.*)\.qcow2c$'
      to: '\1.qcow2'

branches:
  Sisyphus:
    arches:
      aarch64:
    repository_url: http://mirror.yandex.ru/altlinux/{branch}
  p10:
    arches:
      aarch64:
    branding: alt-starterkit
  p9:
    arches:
      aarch64:
    branding: alt-starterkit

scripts:
  securetty:
    contents: |
      #!/bin/sh

      echo pts/0 >> /etc/securetty
      echo pts/1 >> /etc/securetty
    global: no
    number: 1
  apt_sources:
    contents: |
      #!/bin/sh

      repo_source=/etc/apt/sources.list.d/altsp.list
      [ -s "$repo_source" ] || exit 0
      sed -i -E 's/^\s*#(rpm.*http)/\1/' "$repo_source"
    global: no
    number: 80
...
