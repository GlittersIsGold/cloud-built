---
remote: 'cloud@172.16.0.2:/home/cloud/images/{branch}/{arch}'
repository_url: http://mirror.yandex.ru/altlinux/{branch}/branch
try_build_all: True
log_level: debug

rebuild_after:
  days: 5

images:
  opennebula:
    target: vm/opennebula-systemd
    kinds:
    - qcow2c
    exclude_arches:
    - aarch64
    - armh
    - ppc64le
    exclude_branches:
    - c8
    rename:
      regex: '(.*)\.qcow2c$'
      to: '\1.qcow2'
  cloud:
    target: vm/cloud-systemd
    kinds:
    - qcow2c
    exclude_arches:
    - aarch64
    - armh
    - ppc64le
    exclude_branches:
    - p8
    - c8
    scripts:
    - resolved
    packages:
    - update-kernel
    - apt-scripts
    - systemd-settings-disable-kill-user-processes
    tests:
    - method: prog(cloud-build-test-cloud)
    rename:
      regex: '(.*)\.qcow2c$'
      to: '\1.qcow2'

branches:
  Sisyphus:
    arches:
      i586:
      x86_64:
      # aarch64:
      # ppc64le:
      # armh:
    repository_url: http://mirror.yandex.ru/altlinux/{branch}
  p10:
    arches:
      i586:
      x86_64:
      # aarch64:
      # ppc64le:
      # armh:
    branding: alt-starterkit
  p9:
    arches:
      i586:
      x86_64:
      # aarch64:
      # ppc64le:
      # armh:
    branding: alt-starterkit

scripts:
  securetty:
    contents: |
      #!/bin/sh

      echo pts/0 >> /etc/securetty
      echo pts/1 >> /etc/securetty
    global: no
    number: 1
  resolved:
    contents: |
      #!/bin/sh

      ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
    global: no
    number: 99
  apt_sources:
    contents: |
      #!/bin/sh

      repo_source=/etc/apt/sources.list.d/altsp.list
      [ -s "$repo_source" ] || exit 0
      sed -i -E 's/^\s*#(rpm.*http)/\1/' "$repo_source"
    global: no
    number: 80
...
